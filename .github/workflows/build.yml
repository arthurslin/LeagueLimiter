name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to publish releases on version tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Work out version
        id: ver
        shell: bash
        run: |
          code_ver=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('limiter.pyw', encoding='utf-8').read()).group(1))")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_ver="${GITHUB_REF_NAME#v}"
            if [[ "$tag_ver" != "$code_ver" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ $code_ver in limiter.pyw"; exit 1
            fi
          fi
          echo "version=$code_ver" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.11.1
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build app
        run: pyinstaller --noconfirm --windowed --name LeagueLimiter --icon assets/icon.ico --add-data "assets/icon.ico;assets" limiter.pyw

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\LeagueLimiter.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: LeagueLimiter-Setup-${{ steps.ver.outputs.version }}
          path: installer/Output/LeagueLimiter-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installer/Output/LeagueLimiter-Setup.exe \
            --title "League Limiter $GITHUB_REF_NAME" --generate-notes
